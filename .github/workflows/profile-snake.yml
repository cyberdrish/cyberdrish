name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/profile-snake.yml'
      - 'scripts/generate_contribution_snake.py'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: profile-snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'cyberdrish/cyberdrish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate contribution SVG
        run: python scripts/generate_contribution_snake.py --username cyberdrish
      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update contribution snake'
          git push
